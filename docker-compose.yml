version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pdfreview-postgres
    environment:
      POSTGRES_DB: pdfreview
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pdfreview"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pdfreview-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pdfreview-api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/pdfreview
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./storage:/app/storage

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pdfreview-worker
    command: python -m rq worker --url redis://redis:6379/0 pdfreview
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/pdfreview
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./storage:/app/storage

volumes:
  postgres_data:
